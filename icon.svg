<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <rect width="512" height="512" fill="#5fb0ff"/>
  <!-- Gorilla face, blocky -->
  <!-- head outline -->
  <rect x="96"  y="96"  width="320" height="320" fill="#2a2a2a"/>
  <rect x="64"  y="160" width="32"  height="192" fill="#2a2a2a"/>
  <rect x="416" y="160" width="32"  height="192" fill="#2a2a2a"/>
  <!-- face center lighter -->
  <rect x="160" y="224" width="192" height="160" fill="#7a5a48"/>
  <!-- brow -->
  <rect x="128" y="192" width="256" height="32"  fill="#1a1a1a"/>
  <!-- eyes -->
  <rect x="176" y="240" width="48"  height="48"  fill="#ffffff"/>
  <rect x="288" y="240" width="48"  height="48"  fill="#ffffff"/>
  <rect x="192" y="256" width="24"  height="24"  fill="#000000"/>
  <rect x="304" y="256" width="24"  height="24"  fill="#000000"/>
  <!-- nostrils -->
  <rect x="208" y="320" width="24"  height="16"  fill="#3a2a20"/>
  <rect x="280" y="320" width="24"  height="16"  fill="#3a2a20"/>
  <!-- mouth -->
  <rect x="192" y="352" width="128" height="24"  fill="#3a2a20"/>
  <rect x="208" y="368" width="96"  height="16"  fill="#ffffff"/>
  <!-- ears -->
  <rect x="64"  y="224" width="32"  height="64"  fill="#1a1a1a"/>
  <rect x="416" y="224" width="32"  height="64"  fill="#1a1a1a"/>
</svg>
